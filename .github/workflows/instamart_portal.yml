name: Instamart vendor portal to Supabase

on:
  schedule:
    # 11:30 IST daily. Signs in to vendors.zohocreatorportal.in (email + password), exports the
    # Payment Report and Payment adjustment at Invoice level CSVs and reloads the last three months.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      since:
        description: 'YYYY-MM-DD first payment date to reload (blank = 1st of the month three months back)'
        required: false
        default: ''

concurrency:
  group: payment-advice        # never alongside the mail feeds: both write pa_instamart
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - name: Fetch and load
        env:
          INSTAMART_PORTAL_EMAIL: ${{ secrets.INSTAMART_PORTAL_EMAIL }}
          INSTAMART_PORTAL_PASSWORD: ${{ secrets.INSTAMART_PORTAL_PASSWORD }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        # No artifact upload: the repo is public and the exports / failure screenshot hold payment data.
        run: |
          args="--fetch --out ${{ runner.temp }}/portal"
          if [ -n "${{ github.event.inputs.since }}" ]; then args="$args --since ${{ github.event.inputs.since }}"; fi
          python load_portal.py $args
