name: Payment advice to Supabase

on:
  schedule:
    # 10:00, 15:00 and 20:00 IST. Each run re-lists the last 60 days and skips
    # mails already in pa_mail_log, so a missed run loses nothing.
    - cron: '30 4,9,14 * * *'
  workflow_dispatch:
    inputs:
      feeds:
        description: 'comma list of feeds (blank = all)'
        required: false
        default: ''
      since:
        description: 'YYYY-MM-DD to re-list from (blank = last 60 days)'
        required: false
        default: ''

concurrency:
  group: payment-advice
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run feeds
        env:
          PA_GMAIL_TOKEN_JSON: ${{ secrets.PA_GMAIL_TOKEN_JSON }}
          PA_GMAIL_TOKEN_JSON_INSTAMART: ${{ secrets.PA_GMAIL_TOKEN_JSON_INSTAMART }}
          PA_GMAIL_TOKEN_JSON_KOLWAREHOUSE: ${{ secrets.PA_GMAIL_TOKEN_JSON_KOLWAREHOUSE }}   # Blinkit (sap@zomato.com)
          PA_GMAIL_TOKEN_JSON_PAYMENTS: ${{ secrets.PA_GMAIL_TOKEN_JSON_PAYMENTS }}           # More Retail (Kotak CMS)
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PA_PDF_PASSWORDS: ${{ secrets.PA_PDF_PASSWORDS }}
        run: |
          args=""
          if [ -n "${{ github.event.inputs.feeds }}" ]; then args="$args --feeds ${{ github.event.inputs.feeds }}"; fi
          if [ -n "${{ github.event.inputs.since }}" ]; then args="$args --since ${{ github.event.inputs.since }}"; fi
          python run.py $args
      - name: Dorabjee RTV notes (mail)
        if: always()             # the RTV notes do not depend on the advices
        # Dorabjee's purchase return / rejection notes (rej.pdf to accounts@) -> public.dorabjee_rtv_lines
        # (Birbal's PRN tracker, platform Dorabjee). Mails already loaded are skipped.
        env:
          PA_GMAIL_TOKEN_JSON: ${{ secrets.PA_GMAIL_TOKEN_JSON }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          args=""
          if [ -n "${{ github.event.inputs.since }}" ]; then args="$args --since ${{ github.event.inputs.since }}"; fi
          python load_dorabjee_rtv.py $args
      - name: Zepto portal PDFs (Drive)
        # The accounts team saves the day's Payment Advice PDFs from brands.zepto.co.in (OTP login) into
        # Drive "Zepto Payment Advices (portal PDFs)" (owner instamart@, accounts@ edits, birbal@ reads).
        # Each file is read once; a re-run skips it.
        env:
          ZEPTO_PORTAL_DRIVE_TOKEN_JSON: ${{ secrets.ZEPTO_PORTAL_DRIVE_TOKEN_JSON }}   # birbal@ drive.readonly
          ZEPTO_PORTAL_DRIVE_FOLDER: 11Ya59bJS0ECTKtU6he0uOpz-75B281Vz
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$ZEPTO_PORTAL_DRIVE_TOKEN_JSON" ]; then echo "secret ZEPTO_PORTAL_DRIVE_TOKEN_JSON not set; skipped"; exit 0; fi
          python load_zepto_portal.py
